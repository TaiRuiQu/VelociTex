name: Lint

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  DOTNET_CLI_WORKLOAD_UPDATE_NOTIFY_DISABLE: 'true'
  MSBuildEnableWorkloadResolver: 'false'

jobs:
  workflows:
    name: Workflow lint
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Check GitHub Actions syntax and expressions
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -color

  source:
    name: Source lint and JIT assertions
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Parse sources and build with compiler/analyzer warnings as errors
        run: ./tools/Test-CILint.ps1
      - name: Verify source formatting
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'Formatter dependency install failed.' }
          python -m pip install -r tools/requirements-format.txt
          if ($LASTEXITCODE -ne 0) { throw 'clang-format install failed.' }
          ./tools/Test-Format.ps1
      - name: Build native Core ABI
        run: ./native/build-core.ps1
      - name: Run core regression tests (JIT)
        run: |
          dotnet run --project tests/VelociTex.Core.Tests/VelociTex.Core.Tests.csproj -c Release -p:Platform=x64 -p:PublishAot=false -p:RestoreLockedMode=true -- artifacts/tests/jit
          if ($LASTEXITCODE -ne 0) { throw 'Core JIT assertions failed.' }
      - name: Retain assertion report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lint-jit-report
          path: artifacts/tests/jit/report.json
          if-no-files-found: ignore
