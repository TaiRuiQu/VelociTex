name: Lint

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  DOTNET_CLI_WORKLOAD_UPDATE_NOTIFY_DISABLE: 'true'
  MSBuildEnableWorkloadResolver: 'false'

jobs:
  workflows:
    name: Workflow lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Check GitHub Actions syntax and expressions
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -color

  source:
    name: Source lint and JIT assertions
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'
      - name: Parse sources and build with compiler/analyzer warnings as errors
        run: ./tools/Test-CILint.ps1
      - name: Run P4 executable assertions (JIT)
        run: |
          dotnet run --project tests/VelociTex.P1.Tests/VelociTex.P1.Tests.csproj -c Release -p:Platform=x64 -p:PublishAot=false -p:RestoreLockedMode=true -- artifacts/p4/jit --phase=p4
          if ($LASTEXITCODE -ne 0) { throw 'P4 JIT assertions failed.' }
      - name: Retain assertion report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lint-jit-report
          path: artifacts/p4/jit/report.json
          if-no-files-found: ignore
