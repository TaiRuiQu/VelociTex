name: Publish NuGet and GitHub Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: nuget-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lint:
    uses: ./.github/workflows/lint.yml

  package:
    name: Verify and pack release
    needs: lint
    if: github.repository == 'TaiRuiQu/VelociTex'
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      DOTNET_CLI_WORKLOAD_UPDATE_NOTIFY_DISABLE: 'true'
      MSBuildEnableWorkloadResolver: 'false'
    outputs:
      version: ${{ steps.release.outputs.version }}
      sdk: ${{ steps.release.outputs.sdk }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release version and source revision
        id: release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ($env:RELEASE_TAG -cnotmatch '^v((?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?)$') {
            throw 'Expected a version tag such as v1.0.0-rc.2 or v1.0.0.'
          }
          $version = $Matches[1]
          foreach ($identifier in (($version -split '-', 2 | Select-Object -Skip 1) -split '\.')) {
            if ($identifier -match '^0\d+$') { throw 'Numeric prerelease identifiers cannot have leading zeroes.' }
          }
          $revision = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $revision -ne $env:GITHUB_SHA) { throw 'Release tag no longer matches the triggering source revision.' }
          $tagRevision = git rev-parse --verify "refs/tags/$env:RELEASE_TAG^{commit}"
          if ($LASTEXITCODE -ne 0 -or $tagRevision -ne $revision) { throw 'Version tag no longer points to the triggering source revision.' }
          "version=$version" >> $env:GITHUB_OUTPUT
          "prerelease=$($version.Contains('-').ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "sdk=$((Get-Content global.json -Raw | ConvertFrom-Json).sdk.version)" >> $env:GITHUB_OUTPUT
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'
      - name: Run P4 in JIT and Native AOT
        run: ./build.ps1 -Target P4 -Locked
      - name: Compare JIT/AOT results and exports
        run: |
          node tools/reference/p1-runtime-parity.mjs --phase=p4
          if ($LASTEXITCODE -ne 0) { throw 'JIT/AOT parity failed.' }
      - name: Pack and inspect deterministic payloads
        env:
          PACKAGE_VERSION: ${{ steps.release.outputs.version }}
        run: ./pack-local.ps1 -Version $env:PACKAGE_VERSION -OutputDirectory artifacts/packages/release -Locked -VerifyDeterminism
      - name: Generate per-run locks and verify isolated JIT/AOT package consumers
        env:
          PACKAGE_VERSION: ${{ steps.release.outputs.version }}
        run: ./tools/Verify-PackageConsumer.ps1 -Version $env:PACKAGE_VERSION -Feed artifacts/packages/release -Output artifacts/release-consumer -LockDirectory artifacts/release-consumer/locks -UpdateLocks
      - name: Upload exact publish payload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nuget-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: |
            artifacts/packages/release/*.nupkg
            artifacts/packages/release/*.snupkg
            artifacts/packages/release/package-report.json
            artifacts/packages/release/sourcelink-report.json
      - name: Retain verification reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-verification-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          path: |
            artifacts/p4/jit/report.json
            artifacts/p4/aot/report.json
            artifacts/p4/runtime-parity.json
            artifacts/release-consumer/**/verification.json
            artifacts/release-consumer/**/consumer-report.json
            artifacts/release-consumer/locks/*.json
            artifacts/release-consumer/**/*.log

  publish:
    name: Trusted publish to nuget.org
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: nuget
    permissions:
      actions: read
      id-token: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: nuget-${{ github.run_id }}-${{ github.run_attempt }}
          path: packages
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: ${{ needs.package.outputs.sdk }}
      - name: Verify all package hashes before requesting credentials
        env:
          PACKAGE_VERSION: ${{ needs.package.outputs.version }}
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $report = Get-Content packages/package-report.json -Raw | ConvertFrom-Json
          if ($report.version -ne $env:PACKAGE_VERSION -or $report.sourceCommit -ne $env:SOURCE_REVISION -or $report.workingTreeDirty -or !$report.deterministicPayloadRebuildVerified -or !$report.sourceLinkVerified) {
            throw 'Package report does not describe a clean, verified release.'
          }
          $ids = @('VelociTex.Core', 'VelociTex.Rendering.Direct2D', 'VelociTex.WinUI')
          if ($report.packages.Count -ne 3 -or @(Get-ChildItem packages/*.nupkg).Count -ne 3 -or @(Get-ChildItem packages/*.snupkg).Count -ne 3) {
            throw 'Expected exactly three packages and three symbol packages.'
          }
          foreach ($id in $ids) {
            $records = @($report.packages | Where-Object id -CEQ $id)
            if ($records.Count -ne 1 -or $records[0].version -ne $env:PACKAGE_VERSION) { throw "Missing exact package record: $id" }
            $record = $records[0]
            foreach ($extension in @('nupkg', 'snupkg')) {
              $path = "packages/$id.$env:PACKAGE_VERSION.$extension"
              $expected = if ($extension -eq 'nupkg') { $record.sha256 } else { $record.symbolsSha256 }
              if ((Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash -ne $expected) { throw "Hash mismatch: $path" }
            }
          }
      - name: Exchange GitHub OIDC token for short-lived NuGet credentials
        uses: NuGet/login@ebc737b6fc418a6ca0073cf116ec8dc156d8b81e # v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Publish packages and adjacent portable symbols
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
          PACKAGE_VERSION: ${{ needs.package.outputs.version }}
        run: |
          foreach ($id in @('VelociTex.Core', 'VelociTex.Rendering.Direct2D', 'VelociTex.WinUI')) {
            dotnet nuget push "packages/$id.$env:PACKAGE_VERSION.nupkg" --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json
            if ($LASTEXITCODE -ne 0) { throw "NuGet push failed: $id" }
          }

  release:
    name: Create GitHub Release
    needs: [package, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Create release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_PRERELEASE: ${{ needs.package.outputs.prerelease }}
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $tag = [Uri]::EscapeDataString($env:RELEASE_TAG)
          $api = "https://api.github.com/repos/$env:GH_REPO"
          $response = Invoke-WebRequest "$api/git/ref/tags/$tag" -Headers $headers -SkipHttpErrorCheck
          if ($response.StatusCode -ne 200) { throw "Unable to verify remote tag: HTTP $($response.StatusCode)" }
          $target = (ConvertFrom-Json $response.Content).object
          # Dereference annotated tags as well as lightweight tags.
          for ($depth = 0; $target.type -eq 'tag' -and $depth -lt 10; $depth++) {
            $target = (Invoke-RestMethod "$api/git/tags/$($target.sha)" -Headers $headers).object
          }
          if ($target.type -ne 'commit' -or $target.sha -ne $env:SOURCE_REVISION) { throw 'Remote tag no longer points to the verified source revision.' }
          $response = Invoke-WebRequest "$api/releases/tags/$tag" -Headers $headers -SkipHttpErrorCheck
          if ($response.StatusCode -eq 200) {
            $release = ConvertFrom-Json $response.Content
            if ($release.draft -or $release.prerelease -ne [bool]::Parse($env:RELEASE_PRERELEASE)) { throw 'Existing release does not match the expected publication state.' }
            Write-Host "Release already exists: $($release.html_url)"
          } elseif ($response.StatusCode -eq 404) {
            $arguments = @('release', 'create', $env:RELEASE_TAG, '--repo', $env:GH_REPO, '--verify-tag', '--generate-notes', '--title', $env:RELEASE_TAG)
            if ([bool]::Parse($env:RELEASE_PRERELEASE)) { $arguments += '--prerelease' }
            & gh @arguments
            if ($LASTEXITCODE -ne 0) { throw 'GitHub Release creation failed.' }
          } else {
            throw "Unable to query GitHub Release: HTTP $($response.StatusCode)"
          }
