[package]
name = "vt-katex-html"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
katex-rs = { path = "vendor/katex-rs" }
serde_json = { version = "1", default-features = false, features = ["alloc"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
